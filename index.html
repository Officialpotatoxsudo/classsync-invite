<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Join your class · ClassSync</title>
<meta property="og:title" content="Join your class · ClassSync">
<meta property="og:description" content="Open the invite to join your class routine, photos and notes.">
<meta property="og:type" content="website">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; background: #0b0b12; color: #f5f3ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(124,108,246,.28), transparent 42%),
      radial-gradient(circle at 90% 90%, rgba(56,189,248,.16), transparent 40%);
  }
  .card {
    width: 100%; max-width: 430px; padding: 32px 26px 26px;
    border-radius: 28px; background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 24px 80px rgba(0,0,0,.45);
    text-align: center;
  }
  .mark {
    width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 20px;
    display: grid; place-items: center; font-size: 30px; font-weight: 800;
    color: #fff; background: linear-gradient(145deg, #8b7cff, #5b4bdb);
    box-shadow: 0 10px 30px rgba(124,108,246,.35);
  }
  h1 { margin: 0 0 8px; font-size: 26px; line-height: 1.2; letter-spacing: -.02em; }
  p { margin: 0; color: #b9b4d0; font-size: 15px; line-height: 1.55; }
  .code {
    margin: 26px 0 22px; padding: 16px; border-radius: 16px;
    background: rgba(0,0,0,.28); border: 1px dashed rgba(255,255,255,.22);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 26px; font-weight: 700; letter-spacing: .28em;
    padding-left: calc(16px + .28em);
  }
  .code.empty { color: #fca5a5; letter-spacing: .06em; font-size: 18px; }
  .primary {
    display: block; width: 100%; padding: 16px; border-radius: 999px;
    background: #f5f3ff; color: #16121f; text-decoration: none;
    font-weight: 700; font-size: 16px;
  }
  .primary.disabled { opacity: .45; pointer-events: none; }
  .secondary {
    margin-top: 12px; width: 100%; padding: 14px; border-radius: 999px;
    background: transparent; color: #d8d3ee; border: 1px solid rgba(255,255,255,.18);
    font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .secondary:disabled { opacity: .4; cursor: default; }
  .hint { margin-top: 18px; font-size: 12px; color: #8d87a8; line-height: 1.5; }
  .opening { margin-top: 14px; font-size: 12px; color: #a99fff; min-height: 16px; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">C</div>
    <h1 id="title">Join your class</h1>
    <p id="subtitle">You've been invited to a class space on ClassSync.</p>
    <div class="code" id="code">—</div>
    <a class="primary" href="#" id="open">Open ClassSync</a>
    <button class="secondary" id="copy" type="button">Copy invite code</button>
    <div class="opening" id="status"></div>
    <p class="hint">
      Android only. If ClassSync does not open, install it first, then enter
      this code on the “Join your class” screen.
    </p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = (params.get("code") || "").replace(/[^a-z0-9]/gi, "").toUpperCase().slice(0, 8);
      var codeEl = document.getElementById("code");
      var openEl = document.getElementById("open");
      var copyEl = document.getElementById("copy");
      var statusEl = document.getElementById("status");
      var titleEl = document.getElementById("title");
      var subtitleEl = document.getElementById("subtitle");

      if (!code) {
        codeEl.textContent = "Invalid invite";
        codeEl.classList.add("empty");
        openEl.classList.add("disabled");
        copyEl.disabled = true;
        titleEl.textContent = "Invalid invite link";
        subtitleEl.textContent = "Ask your class admin to share the invite again.";
        return;
      }

      var appLink = "classsync://join/" + code;
      codeEl.textContent = code;
      openEl.href = appLink;

      var isAndroid = /Android/i.test(navigator.userAgent);
      if (isAndroid) {
        statusEl.textContent = "Opening ClassSync…";
        setTimeout(function () {
          window.location.href = appLink;
        }, 650);
      } else {
        statusEl.textContent = "Open this link on your Android phone.";
      }

      copyEl.addEventListener("click", function () {
        var done = function () {
          copyEl.textContent = "Copied";
          setTimeout(function () { copyEl.textContent = "Copy invite code"; }, 1600);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(done, done);
        } else {
          var area = document.createElement("textarea");
          area.value = code;
          document.body.appendChild(area);
          area.select();
          try { document.execCommand("copy"); } catch (_) {}
          document.body.removeChild(area);
          done();
        }
      });
    })();
  </script>
</body>
</html>
